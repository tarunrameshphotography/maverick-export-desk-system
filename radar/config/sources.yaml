# Source registry — Section 4 / export_intelligence_system.md "source universe".
# kind: primary | secondary
# signal_type: early | confirm | enforced | context
# method: rss | api | pagewatch | email | manual
#   rss/api/pagewatch are automated in v1. email/manual are registered for
#   completeness and extensibility (Section 4) but not collected until a
#   later phase (needs an inbox connector or portal-specific scraper).
# reliability_1to5: editorial judgement, used as a scoring input (evidence quality).
#
# Every URL marked active was probed live on 14 Sep 2026. Sources that failed
# the probe are kept (active: false) with the reason, so the registry records
# what's missing instead of silently shrinking.

collection:
  # Items older than this at collection time are skipped (Section 26: distinguish
  # current from old). Undated items are kept — their age can't be judged.
  lookback_days: 21

sources:
  # --- A. India (core, daily) ---
  - id: dgft_notifications
    name: DGFT Notifications
    url: https://www.dgft.gov.in/CP/?opt=notification
    kind: primary
    signal_type: early
    cadence: daily
    method: pagewatch
    parse: table_rows
    doc_label: Notification
    authority: DGFT
    country: IN
    category: customs_dgft
    reliability_1to5: 5
    active: true

  - id: dgft_trade_notices
    name: DGFT Trade Notices
    url: https://www.dgft.gov.in/CP/?opt=trade-notice
    kind: primary
    signal_type: early
    cadence: daily
    method: pagewatch
    parse: table_rows
    doc_label: Trade Notice
    authority: DGFT
    country: IN
    category: customs_dgft
    reliability_1to5: 5
    active: true

  - id: dgft_public_notices
    name: DGFT Public Notices
    url: https://www.dgft.gov.in/CP/?opt=public-notice
    kind: primary
    signal_type: confirm
    cadence: daily
    method: pagewatch
    parse: table_rows
    doc_label: Public Notice
    authority: DGFT
    country: IN
    category: customs_dgft
    reliability_1to5: 5
    active: true

  - id: cbic_customs_notifications
    name: CBIC Customs Notifications (Tariff & Non-Tariff)
    url: https://www.cbic.gov.in/entities/customs-notfns
    kind: primary
    signal_type: confirm
    cadence: daily
    method: pagewatch
    country: IN
    category: customs_cbic
    reliability_1to5: 5
    active: false
    notes: "Probe 14 Sep 2026: Angular single-page app (3 KB HTML shell) over a generic content API
      (api/getContent...). Needs a dedicated collector against that API. TOP PRIORITY gap: CBIC
      carries duty changes, ADD/CVD and safeguard notifications."

  - id: icegate_advisories
    name: ICEGATE Advisories
    url: https://www.icegate.gov.in/Webappl/Notification
    kind: primary
    signal_type: early
    cadence: weekly
    method: pagewatch
    country: IN
    category: customs_cbic
    reliability_1to5: 4
    active: false
    notes: "Probe 14 Sep 2026: connection refused. Re-test from the office network before building a parser."

  - id: rbi_press_releases
    name: RBI Press Releases (FEMA / master directions surface here first)
    url: https://www.rbi.org.in/pressreleases_rss.xml
    kind: primary
    signal_type: confirm
    cadence: daily
    method: rss
    country: IN
    category: fx_payments
    reliability_1to5: 5
    active: true

  - id: dgtr_cases
    name: DGTR Anti-Dumping / Safeguard Cases
    url: https://www.dgtr.gov.in/anti-dumping-cases
    kind: primary
    signal_type: early
    cadence: weekly
    method: pagewatch
    country: IN
    category: trade_remedies
    reliability_1to5: 4
    active: false
    notes: "Probe 14 Sep 2026: 404 on this path, then connection timeouts on the site root. Find the
      current case-listing URL; DGTR initiations are a core Draft Watch input."

  - id: pib_english
    name: PIB press releases (English) — trade, tariff, customs, export
    url: https://news.google.com/rss/search
    query: "site:pib.gov.in (export OR tariff OR customs OR trade)"
    kind: primary
    signal_type: early
    cadence: daily
    method: rss
    country: IN
    category: government_scheme
    reliability_1to5: 5
    active: true
    notes: "PIB's own RSS (RssMain.aspx) returns Hindi titles for every ModId/Lang combination
      tested on 14 Sep 2026, and the entity extractor is English-only. English releases are
      located through a Google News site: query; every link resolves to pib.gov.in."

  - id: fieo
    name: FIEO (Federation of Indian Export Organisations)
    url: https://www.fieo.org/
    kind: primary
    signal_type: context
    cadence: weekly
    method: manual
    country: IN
    category: export_promotion
    reliability_1to5: 3
    active: false
    notes: "No stable feed; needs a portal-specific scraper. Registered for completeness (Section 4)."

  # --- B. International / multilateral ---
  - id: wto_eping
    name: WTO ePing (SPS/TBT notifications)
    url: https://eping.wto.org/en
