# Source registry — Section 4 / export_intelligence_system.md "source universe".
# kind: primary | secondary
# signal_type: early | confirm | enforced | context
# method: rss | api | pagewatch | email | manual
#   rss/api/pagewatch are automated in v1. email/manual are registered for
#   completeness and extensibility (Section 4) but not collected until a
#   later phase (needs an inbox connector or portal-specific scraper).
# reliability_1to5: editorial judgement, used as a scoring input (evidence quality).
#
# Every URL marked active was probed live on 14 Sep 2026. Sources that failed
# the probe are kept (active: false) with the reason, so the registry records
# what's missing instead of silently shrinking.

collection:
  # Items older than this at collection time are skipped (Section 26: distinguish
  # current from old). Undated items are kept — their age can't be judged.
  lookback_days: 21

# --- Source roles (2026-09-15 source-universe expansion) ---
# One reliability number can't say what a source is *for*. Every source has a
# tier (defaults: kind primary -> primary_official, secondary -> secondary_media),
# and each tier rates four separate jobs:
#   discovery  — how early/likely it surfaces a new story
#   evidence   — primary: can verify a fact claim (quote machine-checked);
#                secondary: confirmation/context, can back an attributed
#                interpretation/opinion but never verifies a fact on its own;
#                lead_only: starts an investigation, verifies nothing
#   context    — interpretation, market reaction, implications
#   saturation — how well it measures whether a story is already widely covered
# corroborates: false means items from this tier never count toward the
# two-independent-source rule (scoring gate G1/G4), however many there are.
# A source may override individual roles with `roles: {context: high}`;
# `kind` must match its tier's kind (tests/test_source_roles.py enforces it).
source_tiers:
  primary_official:   {kind: primary,   evidence: primary,   corroborates: true,  roles: {discovery: high,   context: low,    saturation: low}}
  trade_data:         {kind: primary,   evidence: primary,   corroborates: true,  roles: {discovery: low,    context: high,   saturation: none}}
  secondary_media:    {kind: secondary, evidence: secondary, corroborates: true,  roles: {discovery: high,   context: high,   saturation: high}}
  research_analysis:  {kind: secondary, evidence: secondary, corroborates: true,  roles: {discovery: medium, context: high,   saturation: medium}}
  trade_body:         {kind: secondary, evidence: secondary, corroborates: true,  roles: {discovery: medium, context: medium, saturation: low}}
  social_expert:      {kind: secondary, evidence: lead_only, corroborates: false, roles: {discovery: high,   context: medium, saturation: low}}
  aggregator_repost:  {kind: secondary, evidence: lead_only, corroborates: false, roles: {discovery: low,    context: low,    saturation: none}}
  field_intelligence: {kind: secondary, evidence: lead_only, corroborates: false, roles: {discovery: high,   context: high,   saturation: none}}

# Independent corroboration != number of URLs. Secondary items are one origin
# when they share a publisher, share a wire credit (text names the wire, or
# the item comes from the wire's own domain), or carry near-identical headlines
# (a syndicated copy). Five outlets running one PTI story = one corroboration.
provenance:
  syndication_title_similarity: 0.75
  wire_services:
    Reuters: reuters.com
    PTI: null
    ANI: null
    IANS: null
    Bloomberg: bloomberg.com

